<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form HTML5 dengan Validasi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .form-wrapper {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .required {
            color: #f56565;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        input:valid:not(:placeholder-shown),
        textarea:valid:not(:placeholder-shown) {
            border-color: #48bb78;
        }

        input:invalid:not(:placeholder-shown),
        textarea:invalid:not(:placeholder-shown) {
            border-color: #f56565;
        }

        .error-message {
            display: none;
            color: #f56565;
            font-size: 12px;
            margin-top: 5px;
        }

        input:invalid:not(:placeholder-shown) ~ .error-message,
        textarea:invalid:not(:placeholder-shown) ~ .error-message {
            display: block;
        }

        .input-info {
            color: #999;
            font-size: 12px;
            margin-top: 5px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .checkbox-group, .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .checkbox-item, .radio-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="checkbox"], input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .checkbox-item label, .radio-item label {
            margin: 0;
            cursor: pointer;
            font-weight: normal;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .reset-btn {
            background: #e0e0e0;
            color: #333;
            margin-left: 10px;
        }

        .reset-btn:hover {
            background: #d0d0d0;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .success-message {
            background: #e6fffa;
            border: 2px solid #48bb78;
            color: #22543d;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        @media (max-width: 600px) {
            .form-wrapper {
                padding: 25px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            .reset-btn {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-wrapper">
            <h1>📋 Form Pendaftaran</h1>
            <p class="subtitle">Isi formulir dengan data yang benar</p>

            <div class="success-message" id="successMessage">
                ✅ Form berhasil dikirim!
            </div>

            <form id="registrationForm" novalidate>
                <!-- Nama dan Email -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="fullName">Nama Lengkap <span class="required">*</span></label>
                        <input 
                            type="text" 
                            id="fullName" 
                            name="fullName"
                            placeholder="Nama Anda"
                            required
                            minlength="3"
                            pattern="[A-Za-z\s]+"
                        >
                        <span class="error-message">Nama minimal 3 karakter, hanya huruf</span>
                    </div>

                    <div class="form-group">
                        <label for="email">Email <span class="required">*</span></label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email"
                            placeholder="email@example.com"
                            required
                        >
                        <span class="error-message">Email tidak valid</span>
                    </div>
                </div>

                <!-- Telepon dan Usia -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="phone">Nomor Telepon <span class="required">*</span></label>
                        <input 
                            type="tel" 
                            id="phone" 
                            name="phone"
                            placeholder="08xxxxxxxxxx"
                            required
                            pattern="[0-9]{10,13}"
                        >
                        <span class="error-message">Telepon 10-13 digit angka</span>
                    </div>

                    <div class="form-group">
                        <label for="age">Usia <span class="required">*</span></label>
                        <input 
                            type="number" 
                            id="age" 
                            name="age"
                            placeholder="17"
                            required
                            min="17"
                            max="100"
                        >
                        <span class="error-message">Usia 17-100 tahun</span>
                    </div>
                </div>

                <!-- Alamat -->
                <div class="form-group">
                    <label for="address">Alamat <span class="required">*</span></label>
                    <textarea 
                        id="address" 
                        name="address"
                        placeholder="Alamat lengkap..."
                        required
                        minlength="10"
                    ></textarea>
                    <span class="error-message">Alamat minimal 10 karakter</span>
                </div>

                <!-- Kota -->
                <div class="form-group">
                    <label for="city">Kota <span class="required">*</span></label>
                    <select id="city" name="city" required>
                        <option value="">-- Pilih Kota --</option>
                        <option value="jakarta">Jakarta</option>
                        <option value="bandung">Bandung</option>
                        <option value="surabaya">Surabaya</option>
                        <option value="medan">Medan</option>
                    </select>
                    <span class="error-message">Pilih kota</span>
                </div>

                <!-- Jenis Kelamin -->
                <div class="form-group">
                    <label>Jenis Kelamin <span class="required">*</span></label>
                    <div class="radio-group">
                        <div class="radio-item">
                            <input 
                                type="radio" 
                                id="male" 
                                name="gender" 
                                value="laki-laki"
                                required
                            >
                            <label for="male">Laki-laki</label>
                        </div>
                        <div class="radio-item">
                            <input 
                                type="radio" 
                                id="female" 
                                name="gender" 
                                value="perempuan"
                            >
                            <label for="female">Perempuan</label>
                        </div>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password <span class="required">*</span></label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                        placeholder="Minimal 8 karakter"
                        required
                        minlength="8"
                    >
                    <span class="error-message">Password minimal 8 karakter</span>
                </div>

                <!-- Konfirmasi Password -->
                <div class="form-group">
                    <label for="confirmPassword">Konfirmasi Password <span class="required">*</span></label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword"
                        placeholder="Ulangi password"
                        required
                    >
                    <span class="error-message">Password tidak cocok</span>
                </div>

                <!-- Syarat & Ketentuan -->
                <div class="form-group">
                    <div class="checkbox-item">
                        <input 
                            type="checkbox" 
                            id="terms" 
                            name="terms"
                            required
                        >
                        <label for="terms">Saya setuju dengan Syarat & Ketentuan <span class="required">*</span></label>
                    </div>
                </div>

                <!-- Tombol -->
                <div class="button-group">
                    <button type="submit">✅ Daftar</button>
                    <button type="reset" class="reset-btn">🔄 Bersihkan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('registrationForm');
        const successMessage = document.getElementById('successMessage');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');

        // Validasi Password Cocok
        confirmPasswordInput.addEventListener('input', function() {
            if (passwordInput.value !== confirmPasswordInput.value) {
                confirmPasswordInput.setCustomValidity('Password tidak cocok');
            } else {
                confirmPasswordInput.setCustomValidity('');
            }
        });

        // Submit Form
        form.addEventListener('submit', function(e) {
            e.preventDefault();

            if (form.checkValidity() === false) {
                alert('❌ Periksa kembali form!');
            } else {
                successMessage.classList.add('show');
                console.log('✅ Form berhasil dikirim!');
                
                setTimeout(() => {
                    form.reset();
                    successMessage.classList.remove('show');
                }, 2000);
            }
        });

        console.log('✅ Form Validation Siap!');
    </script>
</body>
</html>
